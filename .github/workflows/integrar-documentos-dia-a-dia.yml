name: Integrar documentos no dia a dia

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrar-documentos-dia-a-dia.yml'

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - name: Integrar bilhetes no index.html
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'index.html';
            const { data } = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'});
            const content = Buffer.from(data.content, 'base64').toString('utf8');
            if (content.includes('INTEGRADO_VOOS_TURKISH_20261019')) {
              core.info('Já integrado. Nada a fazer.');
              return;
            }
            let s = content;

            s = s.replace(
              'const flights=[\n{date:"23 out.",name:"Turkish Airlines TK1780",route:"Lisboa LIS → Istambul IST",time:"05h55–12h40",code:"",note:"Avião 32Q indicado no Excel; duração indicada 4h45."},\n{date:"23 out.",name:"Turkish Airlines TK320",route:"Istambul IST → Ashgabat ASB",time:"14h15–19h50",code:"",note:"Avião 32Q indicado no Excel; duração indicada 3h35."},\n{date:"2 nov.",name:"Centrum Air C6219 (confirmar)",route:"Tashkent TAS → Bishkek BSZ",time:"11h00–13h10",code:"",note:"A folha também anota “Centrum Air 219” e 1h10 de duração. Confirmar o número, hora local e bilhete original."},\n{date:"7 nov.",name:"Turkish Airlines TK347",route:"Bishkek BSZ → Istambul IST",time:"03h50–06h55",code:"",note:"Avião 32Q indicado no Excel; verificar duração/horas locais."},\n{date:"7 nov.",name:"Turkish Airlines TK1755",route:"Istambul IST → Lisboa LIS",time:"08h25–10h35",code:"",note:"Avião 32Q indicado no Excel; verificar ligação e horários locais."}\n];',
              'const flights=[\n{date:"23 out.",name:"Turkish Airlines TK1780",route:"Lisboa LIS → Istambul IST",time:"05h55–12h40",code:"",note:"Horário confirmado no itinerário enviado. Valor desta viagem: 119,33 €. Número de reserva não consta nas imagens enviadas."},\n{date:"23 out.",name:"Turkish Airlines TK320",route:"Istambul IST → Ashgabat ASB",time:"14h15–19h50",code:"",note:"Horário confirmado no itinerário enviado. Incluído no valor de 119,33 €. Número de reserva não consta nas imagens enviadas."},\n{date:"2 nov.",name:"Centrum Air C6219",route:"Tashkent TAS → Bishkek BSZ",time:"11h00–13h10",code:"SGIMOV",note:"Booking: SGIMOV · Pago por Sandro: 193,90 € · Parte da Marta: 96,95 €. <a href=\\"./documentos/voo-2-nov-tashkent-bishkek.html\\" target=\\"_blank\\" rel=\\"noopener\\">Ver bilhete ↗</a>"},\n{date:"7 nov.",name:"Turkish Airlines TK347",route:"Bishkek BSZ → Istambul IST",time:"03h50–06h55",code:"",note:"Horário confirmado no itinerário enviado. Valor desta viagem: 94,80 €. Número de reserva não consta nas imagens enviadas."},\n{date:"7 nov.",name:"Turkish Airlines TK1755",route:"Istambul IST → Lisboa LIS",time:"08h25–10h35",code:"",note:"Horário confirmado no itinerário enviado. Incluído no valor de 94,80 €. Número de reserva não consta nas imagens enviadas."}\n];'
            );

            s = s.replace(
              '<tr><td><span class="budget-dot flight"></span>Voos</td><td>193,90 € pagos por Sandro · 96,95 € Marta</td><td>Voo Tashkent → Bishkek, C6219, booking SGIMOV. Valor real pago por Sandro: 193,90 €. A parte da Marta é 96,95 €.</td></tr>',
              '<tr><td><span class="budget-dot flight"></span>Voos</td><td>408,03 € pagos por Sandro</td><td>Turkish Airlines: 119,33 € (Lisboa → Istambul → Ashgabat) + 94,80 € (Bishkek → Istambul → Lisboa) + Centrum Air C6219: 193,90 €. Total real pago por Sandro: 408,03 €. A parte da Marta no C6219 é 96,95 €. Os bilhetes da Marta para os voos Turkish são diferentes e não devem ser divididos com base nestes valores.</td></tr>'
            );

            s = s.replace(
              '/* INTEGRADO_DOCUMENTOS_DIA_A_DIA_2026 */',
              '/* INTEGRADO_DOCUMENTOS_DIA_A_DIA_2026 */\n/* INTEGRADO_VOOS_TURKISH_20261019 */'
            );

            if (s === content) throw new Error('Nenhuma alteração encontrada no index.html.');
            const encoded = Buffer.from(s, 'utf8').toString('base64');
            await github.rest.repos.createOrUpdateFileContents({owner: context.repo.owner, repo: context.repo.repo, path, message: 'Atualizar voos Turkish com horários e custos reais', content: encoded, sha: data.sha, branch: 'main'});
