name: Integrar documentos no dia a dia

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrar-documentos-dia-a-dia.yml'

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - name: Actualizar dados confirmados no index.html
        uses: actions/github-script@v7
        with:
          script: |
            const path = 'index.html';
            const { data } = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'});
            let s = Buffer.from(data.content, 'base64').toString('utf8');

            const flights = `const flights=[
            {date:"23 out.",name:"Turkish Airlines TK1780",route:"Lisboa LIS → Istambul IST",time:"05h55–12h40",code:"",note:"Horário confirmado no itinerário. Valor pago por Sandro: 119,33 €. Número de reserva não visível no documento enviado."},
            {date:"23 out.",name:"Turkish Airlines TK320",route:"Istambul IST → Ashgabat ASB",time:"14h15–19h50",code:"",note:"Horário confirmado no itinerário. Incluído nos 119,33 € pagos por Sandro. Número de reserva não visível no documento enviado."},
            {date:"2 nov.",name:"Centrum Air C6219",route:"Tashkent TAS → Bishkek BSZ",time:"11h00–13h10",code:"SGIMOV",note:"Booking SGIMOV. Valor pago por Sandro: 193,90 €. Parte da Marta: 96,95 €. <a href=\\"./documentos/voo-2-nov-tashkent-bishkek.html\\" target=\\"_blank\\" rel=\\"noopener\\">Ver bilhete ↗</a>"},
            {date:"7 nov.",name:"Turkish Airlines TK347",route:"Bishkek BSZ → Istambul IST",time:"03h50–06h55",code:"",note:"Horário confirmado no itinerário. Valor pago por Sandro: 94,80 €. Número de reserva não visível no documento enviado."},
            {date:"7 nov.",name:"Turkish Airlines TK1755",route:"Istambul IST → Lisboa LIS",time:"08h25–10h35",code:"",note:"Horário confirmado no itinerário. Incluído nos 94,80 € pagos por Sandro. Número de reserva não visível no documento enviado."}
            ];`;
            s = s.replace(/const flights=\[[\s\S]*?\n\];/, flights);

            // Dia a dia: os horários dos voos passam a estar identificados como confirmados.
            s = s.replace(/(\["05h55–12h40","Voo TK1780 · Lisboa \(LIS\) → Istambul \(IST\)",")[^"]*("\],)/,
              '$1Horário confirmado no itinerário. Valor pago por Sandro: 119,33 €.$2');
            s = s.replace(/(\["14h15–19h50","Voo TK320 · Istambul \(IST\) → Ashgabat \(ASB\)",")[^"]*("\],)/,
              '$1Horário confirmado no itinerário. Incluído nos 119,33 € pagos por Sandro.$2');
            s = s.replace(/(\["11h00–13h10","Voo C6219 · Tashkent \(TAS\) → Bishkek \(BSZ\)",")[^"]*("\],)/,
              '$1Booking SGIMOV · valor pago por Sandro: 193,90 € · parte da Marta: 96,95 €.$2');
            s = s.replace(/(\["03h50–06h55","Voo TK347 · Bishkek \(BSZ\) → Istambul \(IST\)",")[^"]*("\],)/,
              '$1Horário confirmado no itinerário. Valor pago por Sandro: 94,80 €.$2');
            s = s.replace(/(\["08h25–10h35","Voo TK1755 · Istambul \(IST\) → Lisboa \(LIS\)",")[^"]*("\],)/,
              '$1Horário confirmado no itinerário. Incluído nos 94,80 € pagos por Sandro.$2');

            // Comboios já confirmados: eliminar qualquer referência ao Excel.
            s = s.replace(/(\["07h10–10h38","Comboio Khiva → Bukhara"," )[^"]*("\],)/,
              '$1Bilhete confirmado: 332 000 UZS (≈ €24,90). Duração: 3h28.$2');
            s = s.replace(/(\["05h21–07h38","Comboio Bukhara → Samarcanda"," )[^"]*("\],)/,
              '$1Bilhete confirmado: 169 810 UZS (≈ €12,73). Duração: 2h17.$2');
            s = s.replace(/(\["05h29–09h40","Comboio Samarcanda → Tashkent · SV"," )[^"]*("\],)/,
              '$1Bilhete confirmado: 320 060 UZS (≈ €24,00). Duração: 4h11.$2');

            // Despesas: substituir a previsão antiga de voos pelo valor real pago por Sandro.
            s = s.replace(/<tr><td><span class="budget-dot flight"><\/span>Voos<\/td><td>[^<]*<\/td><td>.*?<\/td><\/tr>/,
              '<tr><td><span class="budget-dot flight"></span>Voos</td><td>408,03 € pagos por Sandro</td><td>Turkish Airlines: 119,33 € (Lisboa → Istambul → Ashgabat) + 94,80 € (Bishkek → Istambul → Lisboa) + Centrum Air C6219: 193,90 €. Total real pago por Sandro: 408,03 €. A parte da Marta no C6219 é 96,95 €. Os bilhetes Turkish da Marta são diferentes e não entram neste acerto.</td></tr>');

            // Recomendações de restaurantes indicadas por amigos.
            if (!s.includes('Recomendação de amigo')) {
              const friendFood = `
{city:"Tashkent",country:"Uzbequistão",name:"Bazar Restaurant",type:"Recomendação de amigo",why:"Recomendação de amigo para ir. O restaurante fica na Uqchi Street 3, junto ao Tashkent City; avaliações recentes destacam a comida e o ambiente.",dish:"Lagman, saladas e pratos uzbeques",maps:"Bazar Restaurant Uqchi Street 3 Tashkent",trip:"https://www.tripadvisor.com/Restaurants-g293968-Tashkent_Tashkent_Province.html"},
{city:"Bukhara",country:"Uzbequistão",name:"JOY Gastro Restaurant",type:"Recomendação de amigo",why:"Recomendação de amigo para ir. Fica na Sarafon 2, no centro histórico; tem avaliações muito fortes e é conhecido pela cozinha uzbeque, ambiente e serviço.",dish:"Vaguri, lagman, samsa e pratos uzbeques",maps:"JOY Gastro Restaurant Sarafon 2 Bukhara",trip:"https://www.tripadvisor.com/Restaurant_Review-g303936-d25439623-Reviews-JOY_Chaikhana_Lounge-Bukhara_Bukhara_Province.html"},
`;
              s = s.replace('const foodPlaces=[', 'const foodPlaces=[' + friendFood);
            }

            // Remover referências textuais residuais ao Excel em toda a aplicação.
            s = s.replace(/Excel/g, 'informação anterior');
            s = s.replace(/informação anterior: /g, 'Bilhete confirmado: ');
            s = s.replace(/dados são dados da informação anterior/g, 'dados estão confirmados');
            s = s.replace(/preços vieram da informação anterior, não estão confirmados nos bilhetes e devem ser substituídos quando houver documentos/g, 'preços confirmados nos bilhetes');
            s = s.replace(/O informação anterior inicial tinha um orçamento global de 295 € para voos e assinalava 78 € para Tashkent–Bishkek\. Vou usar os 295 € como previsão total de todos os voos, incluindo esses 78 €, e não somar os 78 € novamente\./g, 'Os valores reais dos voos de Sandro estão confirmados nos itinerários: 408,03 € no total.');
            s = s.replace(/295 € por pessoa \(estimativa do informação anterior\)/g, '408,03 € pagos por Sandro');

            // Marcação idempotente.
            if (!s.includes('DADOS_VOOS_CONFIRMADOS_20261019')) {
              s += '\n<!-- DADOS_VOOS_CONFIRMADOS_20261019 -->\n';
            }

            const encoded = Buffer.from(s, 'utf8').toString('base64');
            await github.rest.repos.createOrUpdateFileContents({owner: context.repo.owner, repo: context.repo.repo, path, message: 'Actualizar transportes despesas e recomendações de restaurantes', content: encoded, sha: data.sha, branch: 'main'});
