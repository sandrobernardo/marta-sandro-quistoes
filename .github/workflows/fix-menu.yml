name: Fix menu
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Logística menu
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          group = '''<div class="navgroup"><button type="button" class="navgroup-toggle">Logística <span>⌄</span></button><div class="navsubmenu"><button data-page="stays">Alojamentos</button><button data-page="transport">Transportes</button><button data-page="notes">Reservas &amp; notas</button><button data-page="money">Despesas</button><button data-page="private">Área privada</button></div></div>'''
          pattern = r'<div class="navgroup"><button type="button" class="navgroup-toggle">Logística <span>⌄</span></button><div class="navsubmenu">.*?</div></div>\s*<button data-page="money">Despesas</button>'
          s2, n = re.subn(pattern, group, s, count=1, flags=re.S)
          if n == 0:
              pattern2 = r'<div class="navgroup"><button type="button" class="navgroup-toggle">Logística <span>⌄</span></button><div class="navsubmenu">.*?</div></div>'
              s2, n2 = re.subn(pattern2, group, s, count=1, flags=re.S)
              if n2 == 0:
                  raise SystemExit('grupo Logística não encontrado')
              s = s2
          else:
              s = s2
          # Remove any duplicate standalone Despesas immediately following Logística.
          s = re.sub(r'(</div></div>)\s*<button data-page="money">Despesas</button>', r'\1', s, count=1)
          p.write_text(s, encoding='utf-8')
      - name: Improve mobile menu layout
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '''\n/* Mobile menu fix */\n@media(max-width:720px){nav{overflow-x:auto;overflow-y:visible;justify-content:flex-start}nav button{flex:0 0 auto}.navgroup{flex:0 0 auto}.navsubmenu{min-width:205px;max-width:calc(100vw - 24px);left:0}.navgroup.open .navsubmenu{display:grid}}\n'''
          if '/* Mobile menu fix */' not in s:
              s = s.replace('</style>', css + '</style>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit menu change
        run: |
          git config user.name "MS Quistões Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Corrigir menu Logística e área privada"
          git push
