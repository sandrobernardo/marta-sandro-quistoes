name: Remove private area
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-menu.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove private area from app
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          # Remove the private navigation button wherever it occurs.
          s = re.sub(r'<button[^>]*data-page="private"[^>]*>\s*Área privada\s*</button>', '', s, flags=re.I)
          # Remove the complete private section.
          s = re.sub(r'\s*<section id="private"\b.*?</section>\s*', '\n', s, count=1, flags=re.S|re.I)
          # Remove the private-area script and private CSS marker.
          s = re.sub(r'\s*<script[^>]*data-private-area="1"[^>]*>.*?</script>\s*', '\n', s, count=1, flags=re.S|re.I)
          s = re.sub(r'\n?/\* Private area \*/.*?(?=</style>)', '\n', s, count=1, flags=re.S|re.I)
          p.write_text(s, encoding='utf-8')
          for f in ['private/khiva-bukhara.pdf.b64','private/bukhara-samarkand.pdf.b64','private/samarkand-tashkent.pdf.b64']:
              Path(f).unlink(missing_ok=True)
      - name: Remove private workflow files
        run: |
          rm -f .github/workflows/fix-private-area.yml
          rm -f .github/workflows/fix-menu.yml
      - name: Commit cleanup
        run: |
          git config user.name "MS Quistões Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Remover área privada"
          git push
