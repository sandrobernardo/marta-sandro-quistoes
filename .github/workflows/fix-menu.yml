name: Fix menu
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Despesas into Logística
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<button data-page="money">Despesas</button>\n'
          new = '<div class="navgroup"><button type="button" class="navgroup-toggle">Logística <span>⌄</span></button><div class="navsubmenu"><button data-page="stays">Alojamentos</button><button data-page="transport">Transportes</button><button data-page="notes">Reservas & notas</button><button data-page="money">Despesas</button></div></div>\n'
          if old not in s:
              raise SystemExit('menu já alterado ou estrutura diferente')
          # remove the existing standalone Logística group, then replace it with the group containing Despesas
          import re
          s = re.sub(r'<div class="navgroup"><button type="button" class="navgroup-toggle">Logística <span>⌄</span></button><div class="navsubmenu"><button data-page="stays">Alojamentos</button><button data-page="transport">Transportes</button><button data-page="notes">Reservas & notas</button></div></div>\n', '', s, count=1)
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit menu change
        run: |
          git config user.name "MS Quistões Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Colocar Despesas dentro de Logística"
          git push
