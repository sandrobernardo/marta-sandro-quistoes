name: Atualizar nota da fronteira
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[fronteira-auto]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Adicionar nota de chegada
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'Confirmar com a agência a hora de passagem da fronteira e o transporte até Khiva.'
          new = old + ' Na fronteira, pagar em dinheiro (USD): 33 USD pelo teste à COVID e 14 USD de taxa alfandegária. Total: 47 USD por pessoa.'
          if '33 USD pelo teste à COVID' in s:
              raise SystemExit(0)
          if old not in s:
              raise SystemExit('Texto da chegada à fronteira não encontrado')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Guardar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Adicionar custos da fronteira [fronteira-auto]"
          git push
      - name: Remover workflow temporário
        if: ${{ success() }}
        run: |
          rm -f .github/workflows/add-fronteira.yml
          git add .github/workflows/add-fronteira.yml
          git commit -m "Remover workflow temporário [fronteira-auto]" || true
          git push || true
