name: Limpar secção Preparar
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restaurar versão sem Preparar
        run: |
          if [ -f index.backup-20261017.html ]; then
            cp index.backup-20261017.html index.html
          fi
      - name: Publicar
        run: |
          git config user.name "MS Quistões Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Remover secção Preparar"
          git push
